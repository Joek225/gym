# Builds MyBrowser on a cloud Mac to check that it compiles and launches.
# Only runs for the MyBrowser folder on claude/* branches (never touches the website deploy).
name: MyBrowser build check

on:
  push:
    branches: ['claude/**']
    paths: ['MyBrowser/**', '.github/workflows/mybrowser-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: xcodebuild -version && sw_vers
      - name: Build
        shell: bash
        run: |
          xcodebuild -project MyBrowser/MyBrowser.xcodeproj -target MyBrowser \
            -configuration Release SYMROOT="$PWD/build" CODE_SIGN_IDENTITY=- build 2>&1 \
            | grep -E "error|warning:|BUILD" || true
          test -x build/Release/MyBrowser.app/Contents/MacOS/MyBrowser
      - name: Launch, load a page, measure memory
        shell: bash
        run: |
          build/Release/MyBrowser.app/Contents/MacOS/MyBrowser --open https://example.com --log-loads > app.log 2>&1 &
          PID=$!
          sleep 20
          echo "--- App output ---"; cat app.log
          if ! kill -0 $PID 2>/dev/null; then
            echo "!!! The app quit or crashed. Crash report:"
            for f in ~/Library/Logs/DiagnosticReports/MyBrowser*; do
              python3 - "$f" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          body = json.loads(text.split("\n", 1)[1])
          print(body.get("exception"), body.get("termination", {}).get("indicator"))
          for t in body.get("threads", []):
              if t.get("triggered"):
                  imgs = body.get("usedImages", [])
                  for fr in t.get("frames", [])[:25]:
                      img = imgs[fr["imageIndex"]].get("name", "?") if fr.get("imageIndex") is not None else "?"
                      print(" ", img, fr.get("symbol", "?"), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          PY
            done
            exit 1
          fi
          echo "App is still running after 20s (good)"
          grep -q "MyBrowser loaded: https://example.com" app.log
          screencapture -x screenshot.png || true
          echo "--- Memory footprint ---"
          footprint $PID 2>/dev/null | head -n 8 || true
          footprint -p WebContent 2>/dev/null | grep -i "footprint" | head -n 5 || true
          kill $PID
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore
