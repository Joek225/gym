# Builds MyBrowser on a cloud Mac to check that it compiles and launches.
# Only runs for the MyBrowser folder on claude/* branches (never touches the website deploy).
name: MyBrowser build check

on:
  push:
    branches: ['claude/**']
    paths: ['MyBrowser/**', '.github/workflows/mybrowser-build.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: xcodebuild -version && sw_vers
      - name: Build
        shell: bash
        run: |
          xcodebuild -project MyBrowser/MyBrowser.xcodeproj -target MyBrowser \
            -configuration Release SYMROOT="$PWD/build" CODE_SIGN_IDENTITY=- build 2>&1 \
            | grep -E "error|warning:|BUILD" || true
          test -x build/Release/beababrowser.app/Contents/MacOS/beababrowser
      - name: Launch, load a page, measure memory
        shell: bash
        timeout-minutes: 4
        run: |
          build/Release/beababrowser.app/Contents/MacOS/beababrowser --open https://example.com --log-loads > app.log 2>&1 &
          PID=$!
          sleep 20
          echo "--- App output ---"; cat app.log
          if ! kill -0 $PID 2>/dev/null; then
            echo "!!! The app quit or crashed. Running it again under the debugger:"
            lldb --batch -o run -k "thread backtrace 0 -c 40" -k "quit" -- \
              build/Release/beababrowser.app/Contents/MacOS/beababrowser --open https://example.com > lldb.log 2>&1 &
            sleep 30
            cat lldb.log
            exit 1
          fi
          echo "App is still running after 20s (good)"
          grep -q "MyBrowser loaded: https://example.com" app.log && echo "Page loaded (good)"
          echo "--- Memory footprint ---"
          perl -e 'alarm 20; exec @ARGV' footprint $PID 2>/dev/null | head -n 8 || true
          perl -e 'alarm 20; exec @ARGV' footprint -p WebContent 2>/dev/null | grep -i "footprint" | head -n 5 || true
          echo "--- Done, stopping app ---"
          kill -9 $PID || true
      - name: Test reading Chrome's folder from the sandboxed app
        shell: bash
        timeout-minutes: 3
        run: |
          C="$HOME/Library/Application Support/Google/Chrome"
          if [ ! -d "$C/Default" ]; then
            mkdir -p "$C/Default"
            echo '{}' > "$C/Default/Preferences"
            echo '{"profile":{"info_cache":{"Default":{"name":"Test Person"}}}}' > "$C/Local State"
            echo '{"roots":{"bookmark_bar":{"type":"folder","name":"Bar","children":[{"type":"url","name":"Example","url":"https://example.com/"}]},"other":{"type":"folder","name":"Other","children":[]}}}' > "$C/Default/Bookmarks"
          fi
          ls -la "$C" "$C/Default" | head -20
          perl -e 'alarm 60; exec @ARGV' build/Release/beababrowser.app/Contents/MacOS/beababrowser --test-chrome-access > chrome.log 2>&1 || true
          grep "chrome access" chrome.log || cat chrome.log | tail -5
          codesign -d --entitlements - build/Release/beababrowser.app 2>&1 | grep -A3 temporary || true
      - name: Test that a Chrome-style extension loads and runs
        shell: bash
        timeout-minutes: 6
        run: |
          # A copy of the app without the sandbox, so it can read the test extension from this folder.
          xcodebuild -project MyBrowser/MyBrowser.xcodeproj -target MyBrowser -configuration Release \
            SYMROOT="$PWD/build-test" CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS="" build 2>&1 | grep -E "error|BUILD" || true
          APP=build-test/Release/beababrowser.app/Contents/MacOS/beababrowser
          mkdir -p testext
          cat > testext/manifest.json <<'JSON'
          {
            "manifest_version": 3,
            "name": "MyBrowser Test Extension",
            "version": "1.0",
            "action": { "default_title": "Test" },
            "permissions": ["storage"],
            "content_scripts": [{ "matches": ["https://example.com/*"], "js": ["content.js"], "run_at": "document_end" }]
          }
          JSON
          echo 'document.title = "Extension works";' > testext/content.js
          perl -e 'alarm 60; exec @ARGV' "$APP" --install-extension "$PWD/testext" --quit-after-install > ext1.log 2>&1 || true
          cat ext1.log | grep MyBrowser || true
          # New extensions must NOT touch sites until clicked (safety default).
          perl -e 'alarm 25; exec @ARGV' "$APP" --open https://example.com --log-loads > ext0.log 2>&1 || true
          grep "loaded:" ext0.log || true
          if grep -q "title: Extension works" ext0.log; then echo "!!! ON-CLICK TEST FAILED (extension ran without permission)"; exit 1; fi
          grep -q "title: Example Domain" ext0.log && echo "ON-CLICK TEST PASSED" || { echo "!!! page did not load"; exit 1; }
          "$APP" --open https://example.com --log-loads --test-resize --extensions-all-sites > ext2.log 2>&1 &
          PID=$!
          sleep 24
          grep MyBrowser ext2.log | grep -v "min width" || true
          kill -9 $PID || true
          grep -q "title: Extension works" ext2.log && echo "EXTENSION TEST PASSED" || { echo "!!! EXTENSION TEST FAILED"; exit 1; }
          grep -q "window width after resize: 1900" ext2.log && echo "RESIZE TEST PASSED" || { echo "!!! RESIZE TEST FAILED"; exit 1; }
          grep -E "after shrink|min width" ext2.log || true
          grep -q "window width after shrink: 1000" ext2.log && echo "SHRINK TEST PASSED" || { echo "!!! SHRINK TEST FAILED"; exit 1; }
          grep "page sharpness" ext2.log || true
          if grep "page sharpness" ext2.log | grep -q "outerWidth 0,"; then echo "!!! pages see a 0-wide window (blurry Google Docs)"; exit 1; fi
          SNAP=$(grep -o "snapshot: .*" ext2.log | sed 's/snapshot: //' | head -1)
          if [ -n "$SNAP" ] && [ -f "$SNAP" ]; then
            sips -Z 1400 "$SNAP" --out small.png >/dev/null 2>&1 || cp "$SNAP" small.png
            echo "SNAPSHOT-BEGIN"; base64 -i small.png | fold -w 1000; echo "SNAPSHOT-END"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: screenshot.png
          if-no-files-found: ignore
